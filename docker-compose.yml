services:
  # Base de datos PostgreSQL local
  db:
    image: postgres:16-alpine
    container_name: horometro-db
    environment:
      POSTGRES_DB: equipos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d equipos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Spring Boot conectado al contenedor PostgreSQL local
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: horometro-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/equipos_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: